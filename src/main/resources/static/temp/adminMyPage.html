<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자 마이페이지</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/default.css">

    <!-- 관리자 마이페이지 전용 CSS -->
    <link rel="stylesheet" href="/css/style_admin_mypage.css">

</head>

<body class="admin-mypage-page">

    <main>

        <h1 class="page-title">관리자 마이페이지</h1>
        <p class="page-subtitle">관리자 계정 정보를 관리합니다.</p>

        <!-- 프로필 카드 -->
        <section class="card profile-card" aria-label="관리자 프로필">
            <div class="profile-card-top">
                <div class="profile-identity">
                    <div class="avatar-circle" aria-hidden="true">
                        <svg class="avatar-icon-svg" viewBox="0 0 24 24" focusable="false">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <div class="profile-name-wrap">
                        <div class="profile-name-line">
                            <span class="profile-name" id="profile-name">관리자</span>
                        </div>
                        <p class="profile-subtitle" id="profile-subtitle">관리자 (admin)</p>
                    </div>
                </div>
            </div>

            <div class="info-list">
                <div class="info-row">
                    <span class="info-label">이름</span>
                    <span class="info-value" id="val-name">관리자</span>
                </div>
                <div class="info-row">
                    <span class="info-label">아이디</span>
                    <span class="info-value" id="val-login-id">admin</span>
                </div>
            </div>
        </section>

        <!-- 빠른 메뉴 -->
        <section class="quick-menu-section" aria-label="빠른 메뉴">
            <h2 class="section-title">빠른 메뉴</h2>
            <ul class="quick-menu-grid">
                <li>
                    <!-- 상품 관리: 관리자 상품 "목록" 화면은 아직 없어, 가장 가까운 기존 화면인
                         상품 등록 폼으로 연결 -->
                    <a class="quick-menu-tile" href="/temp/registerProduct.html">
                        <span class="quick-menu-icon">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M4 7l8-4 8 4v10l-8 4-8-4V7z"/>
                                <path d="M4 7l8 4 8-4"/>
                                <path d="M12 11v10"/>
                            </svg>
                        </span>
                        <span class="quick-menu-label">상품 관리</span>
                    </a>
                </li>
                <li>
                    <a class="quick-menu-tile" href="/temp/adminOrderDelivery.html">
                        <span class="quick-menu-icon">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M3 7h11v8H3z"/>
                                <path d="M14 10h4l3 3v2h-7z"/>
                                <circle cx="7" cy="17" r="1.7"/>
                                <circle cx="17" cy="17" r="1.7"/>
                            </svg>
                        </span>
                        <span class="quick-menu-label">주문·배송 관리</span>
                    </a>
                </li>
                <li>
                    <a class="quick-menu-tile" href="/temp/couponView.html">
                        <span class="quick-menu-icon">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M12.59 3.41 20 10.83a2 2 0 0 1 0 2.83l-6.34 6.34a2 2 0 0 1-2.83 0L3 12.17V5a2 2 0 0 1 2-2h7.59a2 2 0 0 1 1.41.41Z"/>
                                <circle cx="7.5" cy="7.5" r="1.2"/>
                            </svg>
                        </span>
                        <span class="quick-menu-label">쿠폰 관리</span>
                    </a>
                </li>
                <li>
                    <!-- 문의내역: 대응하는 화면이 아직 없어 임시 처리 -->
                    <a class="quick-menu-tile" href="#">
                        <span class="quick-menu-icon">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M21 11.5a8.38 8.38 0 0 1-4.9 7.6 8.5 8.5 0 0 1-9.4-1.7L3 21l1.9-5.7a8.38 8.38 0 0 1 3-9.4 8.5 8.5 0 0 1 13 5.1 8.48 8.48 0 0 1 .5 2.7z"/>
                            </svg>
                        </span>
                        <span class="quick-menu-label">문의 내역</span>
                    </a>
                </li>
            </ul>
        </section>

        <!-- 일반 메뉴 -->
        <section class="general-menu-section" aria-label="일반 메뉴">
            <h2 class="section-title">일반 메뉴</h2>
            <ul class="accordion" id="general-menu-accordion">
                <li class="accordion-item">
                    <button type="button" class="accordion-header" aria-expanded="false">
                        <span>상품관리</span>
                        <svg class="accordion-chevron" viewBox="0 0 24 24" focusable="false">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>
                    </button>
                    <ul class="accordion-panel" hidden>
                        <li><a href="/temp/registerProduct.html">상품등록</a></li>
                        <li><a href="/temp/adminOrderDelivery.html">주문 배송 관리</a></li>
                    </ul>
                </li>
                <li class="accordion-item">
                    <button type="button" class="accordion-header" aria-expanded="false">
                        <span>쿠폰 조회 및 등록</span>
                        <svg class="accordion-chevron" viewBox="0 0 24 24" focusable="false">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>
                    </button>
                    <ul class="accordion-panel" hidden>
                        <li><a href="/temp/couponView.html">쿠폰 조회 및 등록</a></li>
                    </ul>
                </li>
                <li class="accordion-item">
                    <!-- 문의사항 처리 / 공지 작성: 대응 화면이 아직 없어 미구현 상태(href="#") -->
                    <button type="button" class="accordion-header" aria-expanded="false">
                        <span>문의내역</span>
                        <svg class="accordion-chevron" viewBox="0 0 24 24" focusable="false">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>
                    </button>
                    <ul class="accordion-panel" hidden>
                        <li><a href="#">문의사항 처리</a></li>
                        <li><a href="#">공지 작성</a></li>
                    </ul>
                </li>
            </ul>
        </section>

    </main>

    <!-- TODO(data binding): Member 테이블 연동 필요.
         현재는 로그인 세션 없이 관리자 1인 목업 값을 하드코딩.
         - 프로필 카드는 "이름"과 "아이디" 2개 항목만 표시함(닉네임/이메일/휴대폰 번호는 제거).
           이름: Member.member_name, 아이디: Member.login_id
           (role='ADMIN'인 로그인 세션의 Member row 1건 기준으로 바인딩 필요).
           표시값은 실제 인물명이 아닌 "관리자"로 일반화했고, 아이디는 실제 시드 계정 값인 "admin"과
           일치시킴 — 실제 자격증명(비밀번호 등)은 화면에 노출하지 않음.
         - 빠른 메뉴(4타일): 주문·배송 관리/쿠폰 관리는 이미 존재하는 형제 화면(정적 프로토타입)에
           연결됨 — 목업 아님. 상품 관리는 대응하는 "목록" 화면이 아직 없어 가장 가까운 기존 화면인
           상품 등록 폼(registerProduct.html)으로 연결. 문의 내역은 대응 화면이 없어 href="#" 처리.
         - 일반 메뉴(아코디언): 상위탭은 펼침/접힘 제목일 뿐 그 자체는 페이지로 이동하지 않으며,
           실제 페이지 이동은 하위탭에서만 발생함. "상품관리" 상위탭의 하위탭(상품등록/주문 배송
           관리)과 "쿠폰 조회 및 등록" 상위탭의 하위탭(쿠폰 조회 및 등록 1건)은 각각 기존 화면으로
           연결됨 — 목업 아님. "문의내역" 상위탭의 하위탭(문의사항 처리/공지 작성)은 대응 화면이
           프로젝트에 없어 href="#" 임시 처리(추후 실제 화면/컨트롤러 구현 필요).
         - 이전에 있던 "관리자 권한 정보"/"계정 관리"(로그아웃 포함)/"관리자 최근 활동 내역" 카드는
           사용자 요청에 따라 이번 레이아웃 개편에서 완전히 제거됨. -->
    <script>
    (function () {
        // TODO(data binding): memberName/loginId만 Member 테이블에 실제 컬럼이 존재함.
        var MOCK_ADMIN = {
            memberName: '관리자',
            loginId: 'admin'
        };

        function render() {
            document.getElementById('profile-name').textContent = MOCK_ADMIN.memberName;
            document.getElementById('profile-subtitle').textContent =
                MOCK_ADMIN.memberName + ' (' + MOCK_ADMIN.loginId + ')';

            document.getElementById('val-name').textContent = MOCK_ADMIN.memberName;
            document.getElementById('val-login-id').textContent = MOCK_ADMIN.loginId;
        }

        // 대응 화면이 없는 placeholder 링크(href="#")는 클릭해도 페이지 이동/점프가 없도록 처리
        document.querySelectorAll('a[href="#"]').forEach(function (a) {
            a.addEventListener('click', function (e) { e.preventDefault(); });
        });

        // 일반 메뉴 아코디언: 상위탭 클릭 시 하위탭 목록 펼침/접힘
        document.querySelectorAll('.accordion-header[aria-expanded]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var expanded = btn.getAttribute('aria-expanded') === 'true';
                btn.setAttribute('aria-expanded', String(!expanded));
                var panel = btn.nextElementSibling;
                if (panel) panel.hidden = expanded;
            });
        });

        render();
    })();
    </script>

</body>

</html>
