<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 마이페이지</title>
	<link rel="stylesheet" href="../css/default.css">
</head>
<body>
    <main>
        <div id="title">
            제목 영역 - 관리자 마이페이지
        </div>
        <div id="admin-info">
            관리자 정보 조회구역
            이름 : 이름값
            이름 옆 권한 태그 표시 (관리자 role : admin)
            아이디 : 아이디값
        </div>
        <div id="quick-menu">
            빠른 메뉴 버튼 구역
            상품 등록 이동 버튼
            관리자용 주문배송 관리 이동 버튼
            쿠폰 관리 이동 버튼
            회원 관리 이동 버튼
        </div>
        <div id="admin-Order">
            상품관리 관련 버튼 구역
            상품 등록 이동
            상품 관리 이동 (조회/삭제 구역)
            관리자용 주문배송 관리 이동
        </div>
        <div id="admin-coupon">
            쿠폰 관리 버튼 구역
            쿠폰 등록 이동 버튼
            쿠폰 관리 이동 버튼
        </div>
        <div id="admin-cs">
            고객센터 관련 버튼 구역
            문의사항 이동
            문의내역 이동
            공지사항 이동
        </div>
    </main>
</body>
</html>
