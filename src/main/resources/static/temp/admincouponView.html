<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠폰관리</title>

    <style>

        /* ================================
           전체 페이지
        ================================= */

        body {
            margin: 0;
            background-color: #f8f6f2;
            font-family: Arial, sans-serif;
            color: #333;
        }


        /* ================================
           전체 영역
        ================================= */

        main {
            width: 800px;
            margin: 50px auto;
            padding: 40px;

            background-color: white;
            border: 1px solid #e5e0d8;
            border-radius: 12px;

            box-sizing: border-box;
        }


        /* ================================
           제목
        ================================= */

        #title {
            margin-bottom: 30px;

            font-size: 28px;
            font-weight: bold;
        }


        /* ================================
           쿠폰 등록
        ================================= */

        #CouponRegister {
            margin-bottom: 30px;
        }

        .register-button {
            width: 100%;
            height: 60px;

            border: 1px solid #b59b7b;
            border-radius: 8px;

            background-color: white;
            color: #806746;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .register-button:hover {
            background-color: #f8f6f2;
        }

        .register-icon {
            margin-right: 8px;
            font-size: 22px;
            vertical-align: middle;
        }


        /* ================================
           쿠폰 검색
        ================================= */

        #SearchCoupons {
            display: flex;
            gap: 8px;

            margin-bottom: 30px;
        }

        #coupon-search {
            flex: 1;

            height: 42px;
            padding: 0 12px;

            border: 1px solid #d8d3cc;
            border-radius: 6px;

            outline: none;

            font-size: 14px;
        }

        #coupon-search:focus {
            border-color: #b59b7b;
        }

        #search-button {
            width: 80px;
            height: 42px;

            border: 1px solid #d8d3cc;
            border-radius: 6px;

            background-color: white;

            cursor: pointer;
        }

        #search-button:hover {
            background-color: #faf9f7;
        }


        /* ================================
           등록된 쿠폰 제목
        ================================= */

        .coupon-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 8px;
        }

        #CouponList h2 {
            margin: 0;

            font-size: 18px;
        }

        .coupon-count {
            color: #888;

            font-size: 14px;
            font-weight: normal;
        }


        /* ================================
           목록 관리
        ================================= */

        .list-control {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 15px;
        }

        .select-menu {
            display: flex;
            gap: 12px;
        }

        .select-menu button {
            padding: 0;

            border: none;
            background: none;

            color: #777;

            font-size: 12px;

            cursor: pointer;
        }

        .select-menu button:hover {
            color: #333;
            text-decoration: underline;
        }


        /* ================================
           선택 삭제
        ================================= */

        .delete-button {
            height: 32px;
            padding: 0 12px;

            border: 1px solid #ddd;
            border-radius: 6px;

            background-color: white;
            color: #666;

            font-size: 12px;

            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #f5f5f5;
            color: #333;
        }

        .delete-icon {
            margin-right: 4px;
            font-size: 14px;
        }


        /* ================================
           쿠폰 카드
        ================================= */

        .coupon-card {
            display: flex;
            align-items: center;
            gap: 15px;

            margin-bottom: 12px;
            padding: 18px 20px;

            border: 1px solid #e3ded7;
            border-radius: 10px;

            background-color: white;

            box-sizing: border-box;
        }


        /* ================================
           체크박스
        ================================= */

        .coupon-check {
            width: 18px;
            height: 18px;

            margin: 0;

            cursor: pointer;

            accent-color: #806746;

            flex-shrink: 0;
        }


        /* ================================
           쿠폰 정보
        ================================= */

        .coupon-info {
            flex: 1;
        }

        .coupon-name {
            margin-bottom: 7px;

            font-size: 16px;
            font-weight: bold;
        }

        .coupon-description {
            margin-bottom: 8px;

            color: #777;

            font-size: 13px;
        }

        .coupon-deadline {
            color: #999;

            font-size: 12px;
        }


        /* ================================
           할인율
        ================================= */

        .coupon-discount {
            min-width: 60px;

            font-size: 20px;
            font-weight: bold;

            text-align: center;
        }


        /* ================================
           쿠폰 상태
        ================================= */

        .coupon-status {
            min-width: 55px;
            padding: 6px 8px;

            border-radius: 4px;

            font-size: 11px;
            font-weight: bold;

            text-align: center;
        }

        .active {
            background-color: #eee7dd;
            color: #806746;
        }

        .expired {
            background-color: #eee;
            color: #999;
        }


        /* ================================
           쿠폰 수정 아이콘
        ================================= */

        .edit-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 36px;
            height: 36px;

            border: 1px solid #d8d3cc;
            border-radius: 50%;

            background-color: white;
            color: #806746;

            font-size: 17px;

            cursor: pointer;

            transition: 0.2s;
        }

        .edit-button:hover {
            background-color: #f8f6f2;
            border-color: #b59b7b;

            transform: scale(1.05);
        }


        /* ================================
           반응형
        ================================= */

        @media (max-width: 850px) {

            main {
                width: calc(100% - 30px);

                margin: 30px auto;
                padding: 25px;
            }

        }

    </style>
</head>


<body>

    <main>


        <!-- 제목 -->

        <div id="title">
            쿠폰관리
        </div>


        <!-- 쿠폰 등록 -->

        <div id="CouponRegister">

            <button
                type="button"
                class="register-button">

                <span class="register-icon">＋</span>
                쿠폰 등록

            </button>

        </div>


        <!-- 쿠폰 검색 -->

        <div id="SearchCoupons">

            <input
                type="text"
                id="coupon-search"
                placeholder="쿠폰 이름을 검색해주세요">

            <button
                type="button"
                id="search-button">

                검색

            </button>

        </div>


        <!-- 등록된 쿠폰 -->

        <div id="CouponList">


            <!-- 제목 -->

            <div class="coupon-list-header">

                <h2>
                    등록된 쿠폰
                    <span class="coupon-count">(3)</span>
                </h2>

            </div>


            <!-- 전체 선택 / 삭제 -->

            <div class="list-control">


                <div class="select-menu">

                    <button type="button">
                        전체선택
                    </button>

                    <button type="button">
                        전체선택취소
                    </button>

                </div>


                <button
                    type="button"
                    class="delete-button">

                    <span class="delete-icon">🗑</span>
                    선택 삭제

                </button>

            </div>


            <!-- ================================
                 여름 특별 쿠폰
            ================================= -->

            <div class="coupon-card">


                <input
                    type="checkbox"
                    class="coupon-check"
                    name="coupon"
                    value="1">


                <div class="coupon-info">

                    <div class="coupon-name">
                        여름특별쿠폰
                    </div>

                    <div class="coupon-description">
                        여름 시즌 특별 할인 쿠폰
                    </div>

                    <div class="coupon-deadline">
                        사용기한 : 2026.08.31
                    </div>

                </div>


                <div class="coupon-discount">
                    10%
                </div>


            


                <button
                    type="button"
                    class="edit-button"
                    title="쿠폰 수정">

                    ✎

                </button>

            </div>


            <!-- ================================
                 신규회원 쿠폰
            ================================= -->

            <div class="coupon-card">


                <input
                    type="checkbox"
                    class="coupon-check"
                    name="coupon"
                    value="2">


                <div class="coupon-info">

                    <div class="coupon-name">
                        신규회원 환영 쿠폰
                    </div>

                    <div class="coupon-description">
                        신규 가입 회원 전용 할인 쿠폰
                    </div>

                    <div class="coupon-deadline">
                        사용기한 : 2026.09.15
                    </div>

                </div>


                <div class="coupon-discount">
                    15%
                </div>


               


                <button
                    type="button"
                    class="edit-button"
                    title="쿠폰 수정">

                    ✎

                </button>

            </div>


            <!-- ================================
                 주말 할인 쿠폰
            ================================= -->

            <div class="coupon-card">


                <input
                    type="checkbox"
                    class="coupon-check"
                    name="coupon"
                    value="3">


                <div class="coupon-info">

                    <div class="coupon-name">
                        주말할인쿠폰
                    </div>

                    <div class="coupon-description">
                        주말에 사용할 수 있는 할인 쿠폰
                    </div>

                    <div class="coupon-deadline">
                        사용기한 : 2026.08.25
                    </div>

                </div>


                <div class="coupon-discount">
                    20%
                </div>




                <button
                    type="button"
                    class="edit-button"
                    title="쿠폰 수정">

                    ✎

                </button>

            </div>


        </div>

    </main>

</body>

</html>
