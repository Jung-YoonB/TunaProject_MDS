<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원 탈퇴 완료</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/default.css">

    <!-- 회원 전용 CSS -->
    <link rel="stylesheet" href="/css/style_member.css">

</head>

<body class="withdraw-page">

    <main>

        <!-- 탈퇴 완료 제목 -->
        <div id="title">

            <h1>회원 탈퇴가 완료되었습니다</h1>

            <p>
                그동안 저희 서비스를 이용해주셔서 감사합니다.
            </p>

        </div>


        <!-- 탈퇴 완료 안내 -->
        <div id="WithdrawComplete">

            <div class="complete-icon">
                ✓
            </div>

            <div class="complete-message">

                <strong>탈퇴 처리가 정상적으로 완료되었습니다.</strong>

                <p>
                    입력하신 회원 정보는 관련 법령 및 방침에 따라 처리됩니다.
                </p>

            </div>

        </div>


        <!-- 하단 버튼 -->
        <div id="WithdrawActions">

            <a class="btn-outline" href="/temp/home.html">
                홈으로 돌아가기
            </a>

            <a class="btn-solid" href="/temp/login.html">
                로그인 페이지로
            </a>

        </div>

    </main>

</body>

</html>
