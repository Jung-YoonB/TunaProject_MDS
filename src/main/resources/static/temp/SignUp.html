<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <div id="title"> 제목 : 회원가입 </div>

        <div id="Name">
            이름 : 이름입력창
        </div>
            
        <div id="Birth">
            생년월일 : 생년월일 입력창
        </div>

        <div id="Gender">
            성별 : 성별입력창
        </div>

        <div id="Nickname"> 
            닉네임 : 닉네임 입력창

        <div id="Username">
            아이디 : 아이디입력창
        </div>

        <div id="Password">
            비밀번호 : 비밀번호입력창
        </div>

        <div id="ConfirmPassword">
            비밀번호 확인 : 비밀번호재입력창
        </div>

        <div id="PhoneNumber">
            휴대폰 번호 : 휴대폰번호입력창
        </div>

        <div id ="Email">
            이메일 : 이메일입력창
        </div>

        <div id="PrivacyBox"> 
            개인정보 동의 체크박스
        </div>

        <div id="PrivacyPolicy"> 개인정보처리방침 링크</div>

        <div id="SignUp">
            회원가입 버튼
        </div>

        <div id="Login">
            기존회원 로그인 버튼 
        </div>
    </main>
    
</body>
</html>
