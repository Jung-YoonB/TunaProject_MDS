<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
	<link rel="stylesheet" href="/resources/static/css/default.css">
</head>
<body>
    <header>
		<div id="logo_img">로고(이미지/메인 페이지 이동)</div>
		<div id="search_box">검색창</div>
		<div class="icon">마이페이지, 찜, 장바구니(아이콘)</div>
		<div class="sign">로그인(로그인창 이동), 회원가입(회원가입창 이동)</div>
	</header>
	<main>
		<section class="whishlist-container">
			<!-- 1. 페이지 제목 및 설명 구역-->
			<div class="whishlist-header">
				<h1>찜</h1>
				<p>마음에 드는 상품을 모아두었어요</p>
			</div>
			<!-- 2. 찜한 상품 개수 및 정렬 필터 구역 -->
			<div class="whishlist-header">
				<div class="total-count">찜한 상품 N개</div>
				<ul class="short-options">
					<li class="active">인기순</li>
					<li>낮은 가격순</li>
					<li>높은 가격순</li>
				</ul>
			</div>
			<!-- 3. 상품 카드 리스트 구역 -->
			<div class="product-grid">
				<!-- 상품 카드 영역 (예시) -->
				<active class="product-card">
					<div class="product-thumbnail">
						<img>
						<button>찜 아이콘 버튼(체크되어보이는 상태 -> 누르면 빈하트 /찜해제 효과 // 바로 사라지진 않음) </button>
					</div>
					<div class="product-info">
						<h2>상품 명칭</h2>
						<p>상품 가격</p>
					</div>
					<div class="product-actions">
						<button type="button" class="btn-cart">장바구니 담기</button>
						<button type="button" class="btn-purchase">결제하기</button>
					</div>
				</active>
				<!-- 상품 카드 였던 것 -->
			</div>
			<!-- 4. 하단 안내 및 이동 버튼 구역 -->
			<div class="whishlist-footer">
				<p>마음에 드는 상품을 찜해보세요</p>
			</div>
		</section> 
	</main>
	<footer class="site-footer">
		<!-- 상단: 회사 정보 및 nav -->
		<div class="footer-top">
			<!-- 좌측: 회사 정보 -->
			<div class="company-info">
				<h2>Masion De SAJO</h2>
				<address>
					<p>주소지</p>
					<p>우편번호</p>
					<p>고객센터번호</p>
				</address>
			</div>
			<!-- 우측: 약관 및 고객센터 메뉴 -->
			<nav class="footer-nav">
				<ul>
					<li><a href="#">이용약관</a></li>
					<li><a href="#">개인정보처리방침</a></li>
					<li><a href="#">사업자정보</a></li>
					<li><a href="#">고객센터</a></li>
				</ul>
			</nav>
		</div>
		<!-- 구분선 -->
		<hr class="footer-divider">
		<!-- 하단: 저작권 정보 -->
		<div class="footer-bottom">
			<p class="copyright">&copy; 2024 Masion De SAJO. All rights reserved.</p>
		</div>
	</footer>
</body>
</html>
