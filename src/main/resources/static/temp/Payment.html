<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제하기</title>

    <style>
        body {
            margin: 0;
            background-color: #f8f6f2;
            font-family: Arial, sans-serif;
            color: #333;
        }

        main {
            width: 700px;
            margin: 50px auto;
            padding: 40px;
            background-color: white;
            border: 1px solid #e5e0d8;
            border-radius: 12px;
            box-sizing: border-box;
        }

        #title {
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 18px;
        }

        /* 주문 상품 정보 */
        #ProductInfo {
            margin-bottom: 30px;
        }

        .product-item {
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .product-name,
        .product-quantity {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .product-quantity {
            margin-bottom: 0;
        }

        /* 상품 금액 */
        #Price {
            padding: 20px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .price-item:last-child {
            margin-bottom: 0;
        }

        /* 포인트 */
        #point {
            margin-top: 25px;
            padding: 20px;
            background-color: #faf9f7;
            border-radius: 8px;
        }

        #point label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .point-input {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #used_point {
            width: 150px;
            height: 40px;
            padding: 0 10px;
            border: 1px solid #d8d3cc;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: right;
        }

        .point-unit {
            font-size: 14px;
        }

        .remaining-point {
            margin-top: 8px;
            font-size: 13px;
            color: #999;
        }

        /* 쿠폰 */
        #Coupon {
            margin-top: 20px;
        }

        #coupon_id {
            width: 100%;
            height: 42px;
            padding: 0 10px;
            border: 1px solid #d8d3cc;
            border-radius: 6px;
            background-color: white;
        }

        /* 회원 등급 할인 */
        #MembershipTier {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 15px 0;
        }

        /* 최종 결제 금액 */
        #TotalPayment {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding: 20px 0;
            border-top: 2px solid #333;
            font-size: 18px;
        }

        #final_price {
            font-size: 24px;
        }

        /* 배송지 */
        #DeliveryAddress {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .address-item {
            padding: 20px;
            border: 1px solid #e3ded7;
            border-radius: 8px;
        }

        .address-name,
        .address-detail {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }

        .address-name span:first-child,
        .address-detail span:first-child {
            width: 90px;
            color: #777;
        }

        #is_default {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 8px;
            background-color: #eee;
            color: #777;
            border-radius: 4px;
            font-size: 12px;
        }

        #add-address {
            margin-top: 12px;
            padding: 9px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
        }

        /* 결제수단 */
        #PaymentMethod {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .payment-method {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .payment-method label {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
        }

        /* 결제 동의 */
        #Checkbox {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }

        #Checkbox > div {
            margin-bottom: 12px;
        }

        #Terms,
        #PrivacyPolicy {
            display: inline-block;
            margin-right: 15px;
        }

        #Terms a,
        #PrivacyPolicy a {
            font-size: 13px;
            color: #777;
        }

        /* 버튼 */
        #Confirm {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        #Confirm button {
            flex: 1;
            height: 50px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        #Confirm button[type="submit"] {
            border: none;
            background-color: #222;
            color: white;
        }

        #Confirm button[type="button"] {
            border: 1px solid #ccc;
            background-color: white;
        }
    </style>
</head>


<body>

    <main>

        <!-- 결제하기 제목 -->
        <div id="title">
            결제하기
        </div>


        <!-- 주문 상품 정보 -->
        <div id="ProductInfo">

            <h2>주문상품정보</h2>

            <div class="product-item">

                <div class="product-name">
                    <span>상품명</span>
                    <span id="product_name">상품 이름</span>
                </div>

                <div class="product-quantity">
                    <span>상품 수량</span>
                    <span id="qty">1</span>
                </div>

            </div>

        </div>


        <!-- 상품 금액 -->
        <div id="Price">

            <div class="price-item">
                <span>상품 금액</span>
                <span id="total_price">상품금액값</span>
            </div>

            <div class="price-item">
                <span>배송비</span>
                <span id="delivery_price">배송금액값</span>
            </div>

        </div>


        <!-- 포인트 사용 -->
        <div id="point">

            <label for="used_point">
                포인트 사용
            </label>

            <div class="point-input">

                <input
                    type="number"
                    id="used_point"
                    name="used_point"
                    value="0"
                    min="0"
                >

                <span class="point-unit">원</span>

            </div>

            <!-- 잔여 포인트 -->
            <div class="remaining-point">
                잔여 포인트 10,000원
            </div>

        </div>


        <!-- 쿠폰 사용 -->
        <div id="Coupon">

            <label for="coupon_id">
                쿠폰 사용
            </label>

            <select id="coupon_id" name="coupon_id">

                <option value="">
                    쿠폰을 선택해주세요
                </option>

                <option value="1">
                    여름특별쿠폰 - 10%
                </option>

                <option value="2">
                    신규회원 환영 쿠폰 - 15%
                </option>

                <option value="3">
                    주말할인쿠폰 - 20%
                </option>

            </select>

        </div>


        <!-- 회원 등급 할인 -->
        <div id="MembershipTier">

            <span>회원 등급 할인</span>

            <span id="grade_discount">
                등급별 할인율
            </span>

        </div>


        <!-- 최종 결제 금액 -->
        <div id="TotalPayment">

            <span>총 결제금액</span>

            <strong id="final_price">
                총 결제금액값
            </strong>

        </div>


        <!-- 배송지 정보 -->
        <div id="DeliveryAddress">

            <h2>배송지 정보</h2>

            <div class="address-item">

                <div class="address-name">
                    <span>배송지 이름</span>
                    <span id="address_name">집</span>
                </div>

                <div class="address-detail">
                    <span>배송지 주소</span>
                    <span id="detail_address">
                        서울특별시 강남구 테헤란로 14길
                    </span>
                </div>

                <div class="address-default">
                    <span id="is_default">
                        기본 배송지
                    </span>
                </div>

            </div>

            <button
                type="button"
                id="add-address"
            >
                + 배송지 추가
            </button>

        </div>


        <!-- 결제 수단 -->
        <div id="PaymentMethod">

            <h2>결제수단 선택</h2>

            <div class="payment-method">

                <input type="radio" id="apple_pay"
                    name="payment_id" value="applePay">
                <label for="apple_pay">애플페이</label>

                <input type="radio" id="kakao_pay"
                    name="payment_id" value="kakaoPay">
                <label for="kakao_pay">카카오페이</label>

                <input type="radio" id="naver_pay"
                    name="payment_id" value="naverPay">
                <label for="naver_pay">네이버페이</label>

                <input type="radio" id="hana_pay"
                    name="payment_id" value="hanaPay">
                <label for="hana_pay">하나페이</label>

                <input type="radio" id="payco"
                    name="payment_id" value="payco">
                <label for="payco">페이코</label>

                <input type="radio" id="toss_pay"
                    name="payment_id" value="tossPay">
                <label for="toss_pay">토스페이</label>

                <input type="radio" id="visa"
                    name="payment_id" value="visa">
                <label for="visa">비자</label>

                <input type="radio" id="mastercard"
                    name="payment_id" value="mastercard">
                <label for="mastercard">마스터카드</label>

            </div>

        </div>


        <!-- 결제 동의 -->
        <div id="Checkbox">

            <div>
                <input type="checkbox" id="payment_agree">
                <label for="payment_agree">
                    결제에 동의합니다.
                </label>
            </div>

            <div>
                <input type="checkbox" id="privacy_agree">
                <label for="privacy_agree">
                    개인정보 수집 및 이용에 동의합니다.
                </label>
            </div>

            <div id="Terms">
                <a href="#">이용약관</a>
            </div>

            <div id="PrivacyPolicy">
                <a href="#">개인정보처리방침</a>
            </div>

        </div>


        <!-- 결제 버튼 -->
        <div id="Confirm">

            <button type="submit">
                최종 결제
            </button>

            <button type="button">
                결제 취소
            </button>

        </div>

    </main>

</body>
</html>
