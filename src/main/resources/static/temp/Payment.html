<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <main>
        <div id="title">결제하기</div>

        <div id="ProductInfo">
            주문상품정보
            
            상품명 
            상품 수량 : 수량값
        </div>

        <div id="Price"> 
            상품 금액 : 상품금액값 
            배송비 : 배송금액값
        </div>

        <div id="point"> 
            포인트 사용여부 : 입력칸
        </div>

        <div id="Coupon"> 
            쿠폰 사용여부 : 입력칸
        </div>

        <div id="MembershipTier">
            등급별 할인율   
        </div>

        <div id="TotalPayment"> 총 결제금액 : 총 결제금액값 </div>

        <div id="PaymentMethod">
            결제수단 선택 

            애플페이
            카카오페이
            네이버페이
            하나페이
            페이코
            토스페이 
            비자
            마스터카드
        </div>

        <div id="Checkbox">
            결제동의 체크칸
            개인정보 수집 동의칸
            이용약관 링크 
            개인정보처리방침 링크
        </div>
        
        <div id="Confirm"> 
            최종 결제 버튼 
            결제 취소 버튼
        </div>

        
    </main>
    
</body>
</html>
