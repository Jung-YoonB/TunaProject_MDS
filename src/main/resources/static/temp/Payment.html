<!DOCTYPE html>
<html lang="ko">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>결제하기</title>
		<link rel="stylesheet" href="../css/default.css">
	
	    <style>
	        /* 전체 페이지 */
	        body {
	            margin: 0;
	            background-color: #f8f6f2;
	            font-family: Arial, sans-serif;
	            color: #333;
	        }
	
	        /* 결제 전체 영역 */
	        main {
	            width: 600px;
	            margin: 50px auto;
	            padding: 40px;
	            background-color: white;
	            border: 1px solid #e5e0d8;
	            border-radius: 12px;
	            box-sizing: border-box;
	        }
	
	        /* 제목 */
	        #title {
	            text-align: center;
	            font-size: 30px;
	            font-weight: bold;
	            margin-bottom: 35px;
	        }
	
	        /* 각 섹션 */
	        #ProductInfo, #Price, #point, #Coupon, #MembershipTier,
			#DeliveryAddress, #PaymentMethod, #Checkbox {
	            padding: 22px 0;
	            border-bottom: 1px solid #eee;
	        }
	
	        /* 섹션 제목 */
	        h2 {
	            margin: 0 0 18px;
	            font-size: 18px;
	        }
	
	        /* 주문 상품 */
	        .product-item {
	            padding: 18px;
	            background-color: #faf9f7;
	            border: 1px solid #eee;
	            border-radius: 8px;
	        }
	
	        .product-name, .product-quantity, .price-item {
	            display: flex;
	            justify-content: space-between;
	            align-items: center;
	            margin-bottom: 12px;
	            font-size: 14px;
	        }
	
	        .product-name:last-child, .product-quantity:last-child,
	        .price-item:last-child {
	            margin-bottom: 0;
	        }
	
	        /* 상품 이름 */
	        #product_name {
	            font-weight: bold;
	        }
	
	        /* 상품 수량 */
	        #qty {
	            font-weight: bold;
	        }
	
	        /* 상품 금액 */
	        #Price {
	            padding-top: 25px;
	        }
	
	        .price-item span:last-child {
	            font-weight: bold;
	        }
	
	        /* 포인트 */
	        #point {
	            display: flex;
	            align-items: center;
	            gap: 10px;
	        }
	
	        #point label {
	            margin-right: auto;
	            font-size: 14px;
	            font-weight: bold;
	        }
	
	        #used_point {
	            width: 130px;
	            height: 40px;
	            padding: 0 10px;
	            box-sizing: border-box;
	            border: 1px solid #d8d3cc;
	            border-radius: 6px;
	            outline: none;
	        }
	
	        #used_point:focus {
	            border-color: #b59b7b;
	        }
	
	        /* 쿠폰 */
	        #Coupon {
	            display: flex;
	            align-items: center;
	            gap: 10px;
	        }
	
	        #Coupon label {
	            margin-right: auto;
	            font-size: 14px;
	            font-weight: bold;
	        }
	
	        #coupon_id {
	            width: 280px;
	            height: 40px;
	            padding: 0 10px;
	            border: 1px solid #d8d3cc;
	            border-radius: 6px;
	            background-color: white;
	            outline: none;
	        }
	
	        /* 회원 등급 할인 */
	        #MembershipTier {
	            display: flex;
	            justify-content: space-between;
	            align-items: center;
	        }
	
	        #MembershipTier span:first-child {
	            font-size: 14px;
	            font-weight: bold;
	        }
	
	        #grade_discount {
	            color: #9b805f;
	            font-size: 14px;
	            font-weight: bold;
	        }
	
	        /* 최종 결제 금액 */
	        #TotalPayment {
	            display: flex;
	            justify-content: space-between;
	            align-items: center;
	            margin-top: 20px;
	            padding: 25px;
	            background-color: #f8f6f2;
	            border-radius: 8px;
	        }
	
	        #TotalPayment span {
	            font-size: 16px;
	            font-weight: bold;
	        }
	
	        #final_price {
	            font-size: 24px;
	        }
	
	        /* 배송지 정보 */
	        #DeliveryAddress h2 {
	            margin-bottom: 15px;
	        }
	
	        .address-item {
	            padding: 18px;
	            background-color: #faf9f7;
	            border: 1px solid #eee;
	            border-radius: 8px;
	        }
	
	        .address-name {
	            display: flex;
	            justify-content: space-between;
	            margin-bottom: 12px;
	            font-size: 14px;
	        }
	
	        .address-name span:last-child {
	            font-weight: bold;
	        }
	
	        .address-detail {
	            margin-bottom: 12px;
	            font-size: 14px;
	            line-height: 1.6;
	        }
	
	        .address-detail span:first-child {
	            display: block;
	            margin-bottom: 5px;
	            font-weight: bold;
	        }
	
	        /* 기본 배송지 표시 */
	        #is_default {
	            display: inline-block;
	            padding: 4px 8px;
	            background-color: #eee7dd;
	            border-radius: 4px;
	            font-size: 12px;
	        }
	
	        /* 배송지 추가 버튼 */
	        #add-address {
	            width: 100%;
	            height: 42px;
	            margin-top: 12px;
	            background-color: white;
	            border: 1px solid #d8d3cc;
	            border-radius: 6px;
	            font-size: 13px;
	            font-weight: bold;
	            cursor: pointer;
	        }
	
	        #add-address:hover {
	            background-color: #f8f6f2;
	        }
	
	        /* 결제수단 */
	        #PaymentMethod h2 {
	            margin-bottom: 15px;
	        }
	
	        .payment-method {
	            display: grid;
	            grid-template-columns: repeat(2, 1fr);
	            gap: 10px;
	        }
	
	        /* 실제 라디오 버튼 숨기기 */
	        .payment-method input {
	            display: none;
	        }
	
	        /* 결제수단 버튼 */
	        .payment-method label {
	            display: flex;
	            align-items: center;
	            justify-content: center;
	            height: 48px;
	            border: 1px solid #d8d3cc;
	            border-radius: 6px;
	            font-size: 14px;
	            cursor: pointer;
	            box-sizing: border-box;
	        }
	
	        /* 선택된 결제수단 */
	        .payment-method input:checked + label {
	            border-color: #222;
	            background-color: #f8f6f2;
	            font-weight: bold;
	        }
	
	        /* 결제 동의 */
	        #Checkbox {
	            padding-bottom: 25px;
	        }
	
	        #Checkbox > div {
	            margin-bottom: 12px;
	        }
	
	        #Checkbox label {
	            font-size: 13px;
	        }
	
	        /* 약관 링크 */
	        #Terms, #PrivacyPolicy {
	            display: inline-block;
	            margin-right: 15px;
	        }
	
	        #Terms a, #PrivacyPolicy a {
	            color: #777;
	            font-size: 12px;
	            text-decoration: underline;
	        }
	
	        /* 결제 버튼 영역 */
	        #Confirm {
	            display: flex;
	            gap: 10px;
	            margin-top: 25px;
	        }
	
	        #Confirm button {
	            height: 52px;
	            border-radius: 6px;
	            font-size: 15px;
	            font-weight: bold;
	            cursor: pointer;
	        }
	
	        /* 최종 결제 */
	        #Confirm button[type="submit"] {
	            flex: 2;
	            border: none;
	            background-color: #222;
	            color: white;
	        }
	
	        #Confirm button[type="submit"]:hover {
	            background-color: #444;
	        }
	
	        /* 결제 취소 */
	        #Confirm button[type="button"] {
	            flex: 1;
	            border: 1px solid #d8d3cc;
	            background-color: white;
	            color: #555;
	        }
	
	        #Confirm button[type="button"]:hover {
	            background-color: #f8f6f2;
	        }
	
	    </style>
	</head>
	<body>
	    <main>
	        <!-- 결제하기 제목 -->
	        <div id="title">결제하기</div>
	
	        <!-- 주문 상품 정보 -->
	        <div id="ProductInfo">
	            <h2>주문 상품정보</h2>
	            <div class="product-item">
	                <div class="product-name">
	                    <span>상품명</span>
	                    <span id="product_name">상품 이름</span>
	                </div>
	
	                <div class="product-quantity">
	                    <span>상품 수량</span>
	                    <span id="qty">1</span>
	                </div>
	            </div>
	        </div>
	
	        <!-- 상품 금액 -->
	        <div id="Price">
	            <div class="price-item">
	                <span>상품 금액</span>
	                <span id="total_price">상품 금액값</span>
	            </div>
	
	            <div class="price-item">
	                <span>배송비</span>
	                <span id="delivery_price">배송 금액값</span>
	            </div>
	        </div>
	
	        <!-- 포인트 사용 -->
	        <div id="point">
	            <label for="used_point">포인트 사용</label>
	            <input type="number" id="used_point" name="used_point"
					   value="0" min="0">
	            <span>포인트</span>
	        </div>
	
	        <!-- 쿠폰 사용 -->
	        <div id="Coupon">
	            <label for="coupon_id">쿠폰 사용</label>
	            <select id="coupon_id" name="coupon_id">
	                <option value="">쿠폰을 선택해주세요</option>
	                <option value="1">여름 특별쿠폰 - 10%</option>
	                <option value="2">신규회원 환영 쿠폰 - 15%</option>
	                <option value="3">주말할인쿠폰 - 20%</option>
	            </select>
	        </div>
	
	        <!-- 회원 등급 할인 -->
	        <div id="MembershipTier">
	            <span>회원 등급 할인</span>
	            <span id="grade_discount">등급별 할인율</span>
	        </div>
	
	        <!-- 최종 결제 금액 -->
	        <div id="TotalPayment">
	            <span>총 결제금액</span>
	            <strong id="final_price">총 결제금액값</strong>
	        </div>
	
	        <!-- 배송지 정보 -->
	        <div id="DeliveryAddress">
	            <h2>배송지 정보</h2>
	            <div class="address-item">
					
	                <!-- 배송지 이름 -->
	                <div class="address-name">
	                    <span>배송지 이름</span>
	                    <span id="address_name">집</span>
	                </div>
					
	                <!-- 배송지 주소 -->
	                <div class="address-detail">
	                    <span>배송지 주소</span>
	                    <span id="detail_address">서울특별시 강남구 테헤란로 14길</span>
	                </div>
	
	                <!-- 기본 배송지 -->
	                <span id="is_default">기본 배송지</span>
	            </div>
	
	            <!-- 배송지 추가 -->
	            <button type="button" id="add-address">+ 배송지 추가</button>
	        </div>
	
	        <!-- 결제 수단 -->
	        <div id="PaymentMethod">
	            <h2>결제수단 선택</h2>
	            <div class="payment-method">
	                <input type="radio" id="apple_pay" name="payment_id" value="applePay">
	                <label for="apple_pay">애플페이</label>
	
	                <input type="radio" id="kakao_pay" name="payment_id" value="kakaoPay">
	                <label for="kakao_pay">카카오페이</label>
	
	                <input type="radio" id="naver_pay" name="payment_id" value="naverPay">
	                <label for="naver_pay">네이버페이</label>
	
	                <input type="radio" id="hana_pay" name="payment_id" value="hanaPay">
	                <label for="hana_pay">하나페이</label>
	
	                <input type="radio" id="payco" name="payment_id" value="payco">
	                <label for="payco">페이코</label>
	
	                <input type="radio" id="toss_pay" name="payment_id" value="tossPay">
	                <label for="toss_pay">토스페이</label>
	
	                <input type="radio" id="visa" name="payment_id" value="visa">
	                <label for="visa">비자</label>
	
	                <input type="radio" id="mastercard" name="payment_id" value="mastercard">
	                <label for="mastercard">마스터카드</label>
	            </div>
	        </div>
	
	        <!-- 결제 동의 -->
	        <div id="Checkbox">
	            <div>
	                <input type="checkbox" id="payment_agree">
	                <label for="payment_agree">결제에 동의합니다.</label>
	            </div>
	            <div>
	                <input type="checkbox" id="privacy_agree">
	                <label for="privacy_agree">개인정보 수집 및 이용에 동의합니다.</label>
	            </div>
	
	            <!-- 이용약관 -->
	            <div id="Terms">
	                <a href="#">이용약관</a>
	            </div>
	
	            <!-- 개인정보처리방침 -->
	            <div id="PrivacyPolicy">
	                <a href="#">개인정보처리방침</a>
	            </div>
	        </div>
	
	        <!-- 결제 버튼 -->
	        <div id="Confirm">
	            <button type="submit">최종 결제</button>
	            <button type="button">결제 취소</button>
	        </div>
	    </main>
	</body>
</html>
