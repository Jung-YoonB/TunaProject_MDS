<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oderDelivery</title>
	<link rel="stylesheet" href="/resources/static/css/default.css">
</head>
<body>
	<header>
			<div>로고(이미지/메인 페이지 이동)</div>
			<div>검색창</div>
			<div>마이페이지, 찜, 장바구니(아이콘)</div>
			<div>로그인(로그인창 이동), 회원가입(회원가입창 이동)</div>
		</header>
	<main class="order-history" id="order-history-container" data-member-id="회원세션ID">
		<!-- 글자 영역(Header) -->
		<header class="page-header">
		<h2>주문/배송 내역</h2>
		</header>
		<!-- 상단 영역 -->
		<nav class="status-filter" aria-label="주문 상태 필터">
			<ul>
				<li><button type="button" class="active" data-status="all">전체</button></li>
				<li><button type="button" data-status="preparing">배송준비중</button></li>
				<li><button type="button" data-status="shipped">배송중</button></li>
				<li><button type="button" data-status="delivered">배송완료</button></li>
				<li><button type="button" data-status="canceled">주문취소</button></li>
			</ul>
		</nav>
		<!-- 중간 영역 -->
		<section>
			
		</section>
		
		<div>
			주문번호 / 주문일
			상품 명칭
			선택된 상품 개수, 상품 가격
			배송 상태
			현재 배송 상태 (표시선)
			배송 조회 (버튼)
			리뷰 작성 (버튼)
		</div>
	</main>
	<footer>
		<div>
			<div>
				<h2>Masion De SAJO</h2>
				<address>
					<p>주소지</p>
					<p>우편번호</p>
					<p>고객센터번호</p>
				</address>
			</div>
			<!-- 우측: 약관 및 고객센터 메뉴 -->
			<nav>
				<ul>
					<li><a href="#">이용약관</a></li>
					<li><a href="#">개인정보처리방침</a></li>
					<li><a href="#">사업자정보</a></li>
					<li><a href="#">고객센터</a></li>
				</ul>
			</nav>
		</div>
		<!-- 구분선 -->
		<hr>
		<!-- 하단: 저작권 정보 -->
		<div>
			<p class="copyright">&copy; 2024 Masion De SAJO. All rights reserved.</p>
		</div>
	</footer>
</body>
</html>
