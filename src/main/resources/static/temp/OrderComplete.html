<!DOCTYPE html>
<html lang="ko">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>주문 완료</title>
		<link rel="stylesheet" href="../css/default.css">
		
	    <style>
	        /* 전체 페이지 */
	        main {
	            width: 700px;
	            margin: 50px auto;
	            text-align: center;
	        }
	
	        /* 제목 */
	        #title h1 {
	            margin-bottom: 10px;
	        }
	
	        #title p {
	            margin-bottom: 40px;
	        }
	
	        /* 주문 완료 안내 */
	        #OrderComplete {
	            padding: 30px;
	            border: 1px solid #ddd;
	            margin-bottom: 40px;
	        }
	
	        .complete-icon {
	            font-size: 40px;
	            margin-bottom: 15px;
	        }
	
	        /* 공유 영역 */
	        #ShareLink {
	            margin-bottom: 40px;
	        }
	
	        /* ⭐ 공유 버튼 3개 가로 배열 */
	        #ShareButtons {
	            display: flex;
	            gap: 15px;
	            justify-content: center;
	            margin-top: 25px;
	        }
	
	        /* ⭐ 각각 큰 네모 박스 */
	        #ShareButtons > div {
	            width: 180px;
	            height: 150px;
	        }
	
	        #ShareButtons button {
	            width: 100%;
	            height: 100%;
	            background-color: white;
	            border: 1px solid #ddd;
	            border-radius: 10px;
	            cursor: pointer;
	            display: flex;
	            flex-direction: column;
	            justify-content: center;
	            align-items: center;
	            gap: 15px;
	        }
	
	        /* 공유 아이콘 */
	        .share-icon {
	            font-size: 30px;
	            font-weight: bold;
	        }
	
	        /* 공유 링크 */
	        #ShareUrl {
	            margin-bottom: 30px;
	        }
	
	        .share-url-box {
	            display: flex;
	            margin-top: 10px;
	        }
	
	        #share-url {
	            flex: 1;
	            padding: 12px;
	        }
	
	        .share-url-box button {
	            padding: 12px 20px;
	        }
	
	        /* 하단 버튼 */
	        #OrderHistory {
	            display: flex;
	            justify-content: center;
	            gap: 10px;
	        }
	
	        #OrderHistory button {
	            padding: 12px 30px;
	            border: 1px solid #ddd;
	            background-color: white;
	            cursor: pointer;
	        }
	    </style>
	
	</head>
	<body>
	    <main>
	        <!-- 주문 완료 -->
	        <div id="title">
	            <h1>주문 완료!</h1>
	            <p>주문이 정상적으로 완료되었습니다.</p>
	        </div>
	
	        <!-- 주문 완료 안내 -->
	        <div id="OrderComplete">
	            <div class="complete-icon">✓</div>
	            <div class="complete-message">
	                <strong>감사합니다!</strong>
	                <p>고객님의 주문이 정상적으로 접수되었습니다.</p>
	            </div>
	        </div>
	
	        <!-- 공유 -->
	        <div id="ShareLink">
	            <h2>주문 완료 소식 공유하기</h2>
	            <p>가족이나 친구에게 주문 완료 소식을 공유해보세요.</p>
	
	            <!-- 공유 버튼 -->
	            <div id="ShareButtons">
	
	                <!-- 카카오톡 -->
	                <div id="kakao">
	                    <button type="button">
	                        <span class="share-icon">kakao</span>
	                        <span>카카오톡 공유</span>
	                    </button>
	                </div>
	
	                <!-- 메시지 -->
	                <div id="message">
	                    <button type="button">
	                        <span class="share-icon">message</span>
	                        <span>메시지 공유</span>
	                    </button>
	                </div>
	
	                <!-- 다른 방법 -->
	                <div id="Other">
	                    <button type="button">
	                        <span class="share-icon">↗</span>
	                        <span>다른 방법으로 공유</span>
	                    </button>
	                </div>
	            </div>
	        </div>
	
	        <!-- 공유 링크 -->
	        <div id="ShareUrl">
	            <label for="share-url">공유 링크</label>
	            <div class="share-url-box">
	                <input type="text" id="share-url" value="주문 완료 페이지 링크" readonly>
	                <button type="button">링크 복사</button>
	            </div>
	        </div>
	
	        <!-- 하단 버튼 -->
	        <div id="OrderHistory">
	            <button type="button">주문내역 확인</button>
	            <button type="button">쇼핑 계속하기</button>
	        </div>
	    </main>
	</body>
</html>
