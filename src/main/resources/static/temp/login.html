<!DOCTYPE html>
<html lang="ko">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>로그인</title>
		<link rel="stylesheet" href="../css/default.css">
		
	    <style>
	        /* 전체 페이지 */
	        body {
	            margin: 0;
	            background-color: #f8f6f2;
	        }
	
	        /* 로그인 전체 영역 */
	        main {
	            width: 420px;
	            margin: 100px auto;
	            padding: 40px;
	            background-color: white;
	            border: 1px solid #e5e0d8;
	            border-radius: 12px;
	            box-sizing: border-box;
	        }
	
	        /* 로그인 제목 */
	        #title {
	            text-align: center;
	            font-size: 30px;
	            font-weight: bold;
	            margin-bottom: 35px;
	        }
	
	        /* 입력 영역 */
	        .login-field {
	            margin-bottom: 20px;
	        }
	
	        /* 아이디 / 비밀번호 글자 */
	        .login-field label {
	            display: block;
	            margin-bottom: 8px;
	            font-size: 14px;
	            font-weight: bold;
	        }
	
	        /* 입력창 */
	        .login-input {
	            width: 100%;
	            height: 48px;
	            padding: 0 15px;
	            box-sizing: border-box;
	            border: 1px solid #d8d3cc;
	            border-radius: 6px;
	            font-size: 15px;
	            outline: none;
	        }
	
	        /* 입력창 클릭 */
	        .login-input:focus {
	            border-color: #b59b7b;
	        }
	
	        /* 로그인 버튼 영역 */
	        #SignIn {
	            margin-top: 30px;
	        }
	
	        /* 로그인 버튼 */
	        #SignIn button {
	            width: 100%;
	            height: 52px;
	            border: none;
	            border-radius: 6px;
	            background-color: #222;
	            color: white;
	            font-size: 16px;
	            font-weight: bold;
	            cursor: pointer;
	        }
	
	        /* 계정 관련 메뉴 */
	        #AccountInfo {
	            display: flex;
	            justify-content: center;
	            margin-top: 25px;
	        }
	
	        /* 계정 관련 버튼 */
	        #AccountInfo button {
	            padding: 0 15px;
	            background: none;
	            border: none;
	            border-right: 1px solid #ddd;
	            color: #777;
	            font-size: 13px;
	            cursor: pointer;
	        }
	
	        /* 마지막 버튼은 구분선 제거 */
	        #AccountInfo button:last-child {
	            border-right: none;
	        }
	
	        /* 마우스 올렸을 때 */
	        #AccountInfo button:hover {
	            color: #222;
	        }
	    </style>
	</head>

	<body>
	    <main>
	        <!-- 로그인 제목 -->
	        <div id="title">로그인</div>
	        <form>
	            <!-- 아이디 -->
	            <div class="login-field">
	                <label for="login_id">아이디</label>
	                <input type="text" id="login_id" name="login_id"
						   class="login-input" placeholder="아이디를 입력해주세요">
	            </div>
				
	            <!-- 비밀번호 -->
	            <div class="login-field">
	                <label for="login_pw">비밀번호</label>
	                <input type="password" id="login_pw" name="login_pw"
						   class="login-input" placeholder="비밀번호를 입력해주세요">
	            </div>
	
	            <!-- 로그인 버튼 -->
	            <div id="SignIn">
	                <button type="submit">로그인</button>
	            </div>
	        </form>
	
	        <!-- 계정 관련 메뉴 -->
	        <div id="AccountInfo">
	            <button type="button">아이디 찾기</button>
	            <button type="button">비밀번호 찾기</button>
	            <button type="button">회원가입</button>
	        </div>
	    </main>
	</body>

</html>
