<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>쿠폰관리</title>


    <style>

        /* 전체 페이지 */
        body {
            margin: 0;

            background-color: #f8f6f2;

            font-family: Arial, sans-serif;

            color: #333;
        }


        /* 전체 영역 */
        main {
            width: 700px;

            margin: 50px auto;

            padding: 40px;

            background-color: white;

            border: 1px solid #e5e0d8;

            border-radius: 12px;

            box-sizing: border-box;
        }


        /* 제목 */
        #title {
            margin-bottom: 30px;

            font-size: 28px;

            font-weight: bold;
        }


        /* 쿠폰 요약 */
        #CouponSummary {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 30px;
        }


        .summary-box {
            padding: 20px;

            background-color: #faf9f7;

            border: 1px solid #eee;

            border-radius: 8px;

            text-align: center;
        }


        .summary-title {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            color: #777;
        }


        .summary-value {
            font-size: 22px;

            font-weight: bold;
        }


        /* 쿠폰 검색 */
        #SearchCoupons {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 25px;
        }


        #coupon-search {
            flex: 1;

            height: 42px;

            padding: 0 12px;

            border: 1px solid #d8d3cc;

            border-radius: 6px;

            box-sizing: border-box;

            outline: none;
        }


        #coupon-search:focus {
            border-color: #b59b7b;
        }


        #search-button {
            width: 80px;

            height: 42px;

            border: 1px solid #d8d3cc;

            border-radius: 6px;

            background-color: white;

            cursor: pointer;
        }


        /* 쿠폰 목록 */
        #CouponList {
            margin-top: 20px;
        }


        #CouponList h2 {
            margin-bottom: 15px;

            font-size: 18px;
        }


        /* 쿠폰 카드 */
        .coupon-card {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 12px;

            padding: 20px;

            border: 1px solid #e3ded7;

            border-radius: 10px;

            background-color: white;

            box-sizing: border-box;
        }


        .coupon-info {
            flex: 1;
        }


        .coupon-name {
            margin-bottom: 7px;

            font-size: 16px;

            font-weight: bold;
        }


        .coupon-description {
            margin-bottom: 8px;

            font-size: 13px;

            color: #777;
        }


        .coupon-deadline {
            font-size: 12px;

            color: #999;
        }


        /* 할인율 */
        .coupon-discount {
            min-width: 90px;

            margin-left: 15px;

            font-size: 22px;

            font-weight: bold;

            text-align: center;

            color: #9b805f;
        }


        /* 쿠폰 상태 */
        .coupon-status {
            margin-left: 15px;

            padding: 5px 9px;

            border-radius: 4px;

            font-size: 11px;

            font-weight: bold;
        }


        .active {
            background-color: #eee7dd;

            color: #806746;
        }


        .expired {
            background-color: #eee;

            color: #999;
        }


        /* 쿠폰 사용 버튼 */
        .use-coupon {
            width: 70px;

            height: 35px;

            margin-left: 15px;

            border: none;

            border-radius: 5px;

            background-color: #222;

            color: white;

            font-size: 12px;

            cursor: pointer;
        }


        .use-coupon:hover {
            background-color: #444;
        }


        /* 만료 쿠폰 */
        .expired-card {
            opacity: 0.55;
        }

    </style>

</head>


<body>

    <main>


        <!-- 제목 -->
        <div id="title">
            쿠폰관리
        </div>


        <!-- 쿠폰 요약 -->
        <div id="CouponSummary">


            <div class="summary-box">

                <span class="summary-title">
                    발행쿠폰
                </span>

                <span class="summary-value">
                    5
                </span>

            </div>


            <div class="summary-box">

                <span class="summary-title">
                    사용쿠폰
                </span>

                <span class="summary-value">
                    2
                </span>

            </div>


            <div class="summary-box">

                <span class="summary-title">
                    활성쿠폰
                </span>

                <span class="summary-value">
                    3
                </span>

            </div>


            <div class="summary-box">

                <span class="summary-title">
                    만료쿠폰
                </span>

                <span class="summary-value">
                    2
                </span>

            </div>


        </div>


        <!-- 쿠폰 검색 -->
        <div id="SearchCoupons">

            <input
                type="text"
                id="coupon-search"
                placeholder="쿠폰 이름을 검색해주세요"
            >


            <button
                type="button"
                id="search-button"
            >
                검색
            </button>

        </div>


        <!-- 쿠폰 목록 -->
        <div id="CouponList">

            <h2>
                내 쿠폰
            </h2>


            <!-- 여름 특별 쿠폰 -->
            <div class="coupon-card">

                <div class="coupon-info">

                    <div class="coupon-name">
                        여름특별쿠폰
                    </div>

                    <div class="coupon-description">
                        여름 시즌 특별 할인 쿠폰
                    </div>

                    <div class="coupon-deadline">
                        사용기한 : 2026.08.31
                    </div>

                </div>


                <div class="coupon-discount">
                    10%
                </div>


                <div class="coupon-status active">
                    사용가능
                </div>


                <button
                    type="button"
                    class="use-coupon"
                >
                    사용하기
                </button>

            </div>


            <!-- 신규회원 쿠폰 -->
            <div class="coupon-card">

                <div class="coupon-info">

                    <div class="coupon-name">
                        신규회원 환영 쿠폰
                    </div>

                    <div class="coupon-description">
                        신규 가입 회원 전용 할인 쿠폰
                    </div>

                    <div class="coupon-deadline">
                        사용기한 : 2026.09.15
                    </div>

                </div>


                <div class="coupon-discount">
                    15%
                </div>


                <div class="coupon-status active">
                    사용가능
                </div>


                <button
                    type="button"
                    class="use-coupon"
                >
                    사용하기
                </button>

            </div>


            <!-- 주말 할인 쿠폰 -->
            <div class="coupon-card">

                <div class="coupon-info">

                    <div class="coupon-name">
                        주말할인쿠폰
                    </div>

                    <div class="coupon-description">
                        주말에 사용할 수 있는 할인 쿠폰
                    </div>

                    <div class="coupon-deadline">
                        사용기한 : 2026.08.25
                    </div>

                </div>


                <div class="coupon-discount">
                    20%
                </div>


                <div class="coupon-status expired">
                    만료
                </div>


                <button
                    type="button"
                    class="use-coupon"
                    disabled
                >
                    사용불가
                </button>

            </div>


        </div>


    </main>

</body>

</html>
